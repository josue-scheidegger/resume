# Presentation data of the PDF résumé that has no place in resume.yaml.
# Everything else (identity, address, work, education, mindset...) is read
# from data/resume.yaml.

# Values of resume.yaml replaced in the PDF only (the sidebar is narrow).
overrides:
  address:
    street: Ch. de Clon 14

uuid: d8f6be22-40d0-4041-ab5d-590845b0e337
headline: [Entrepreneur, AutomationEngineer]

# Printed as print("...") in the sidebar.
sports: [Systema, Horsemanship, Munz Floor]

# Two columns, filled left then right; the right column has a little more room.
future: [Community, Hide photography, Real estate, Eco-regeneration]

# Colours of the page, each set as the CSS variable --<key> (pdf/page.css).
palette:
  sidebar: "#2f3e4e"      # panel backgrounds
  header: "#d5dde5"
  skills: "#e2e8ee"
  hobbies: "#dbe3ea"
  work: "#eceff2"
  education: "#f2f4f6"
  future: "#c7d3df"
  ink: "#2f3e4e"          # name, headline, description
  text: "#3d4a57"         # body text, section titles
  muted: "#5b6b7a"        # education entries
  line: "#4a6e93"         # timelines, future bullets
  cloud-key: "#4a6e93"    # key words of the clouds
  cloud: "#6b7a89"        # other words of the clouds

qr:
  url: https://josue-scheidegger.github.io/resume/

# The icon names the service, so `text` is only the handle (the sidebar is
# narrow); `url` makes it a link in the PDF.
social:
  - icon: github
    text: josue-scheidegger
    url: https://github.com/josue-scheidegger
  - icon: linkedin
    text: josue-scheidegger
    url: https://www.linkedin.com/in/josue-scheidegger/
