name: Deploy CV

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Opt-in Node.js 24 pour les actions JS (sinon warning de dépréciation Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Un seul déploiement Pages à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour la date "last updated" (plugin git)

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      # Chromium imprime le PDF ; le site en publie une copie.
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

      - id: deployment
        uses: actions/deploy-pages@v4
